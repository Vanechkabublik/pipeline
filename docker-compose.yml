# Разработка: docker compose up -d db      (только база, API — через npm run start:dev)
# Деплой:     docker compose up -d --build (база + API)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db # внутри docker база доступна по имени сервиса
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy # ждём, пока база реально готова
    restart: unless-stopped

volumes:
  pgdata:
